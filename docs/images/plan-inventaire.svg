<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
  <title id="title">Plan du premier module d’inventaire FITS</title>
  <desc id="desc">Les archives restent en lecture seule. L’inventaire produit des rapports distincts et est vérifié avec des données synthétiques.</desc>
  <rect width="1000" height="390" fill="#101d30"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#edf4ff">
    <text x="40" y="48" font-size="26" font-weight="bold">Du fichier FITS au relevé vérifiable</text>
    <g fill="#1c3655" stroke="#75c9e8" stroke-width="2">
      <rect x="40" y="95" width="240" height="125" rx="14"/>
      <rect x="375" y="95" width="250" height="125" rx="14"/>
      <rect x="720" y="95" width="240" height="125" rx="14"/>
    </g>
    <g font-size="20" text-anchor="middle">
      <text x="160" y="135">Archives originales</text>
      <text x="160" y="172" font-size="17">Lecture seule</text>
      <text x="500" y="135">Inventaire local</text>
      <text x="500" y="172" font-size="17">SHA-256 · HDU · anomalies</text>
      <text x="840" y="135">Dossier de rapports</text>
      <text x="840" y="172" font-size="17">JSON · CSV · Markdown · SVG</text>
    </g>
    <g stroke="#75c9e8" stroke-width="3" fill="none">
      <path d="M292 155h65m-12-9 12 9-12 9"/>
      <path d="M638 155h65m-12-9 12 9-12 9"/>
    </g>
    <text x="40" y="280" font-size="19">Avant : plan et commit. Après : tests, contrôle du pilote et tutoriel à jour.</text>
    <text x="40" y="320" font-size="17" fill="#b9cce1">Aucun recalage, aucune conversion horaire présumée, aucune soumission scientifique.</text>
    <text x="40" y="355" font-size="15" fill="#b9cce1">Schéma prévu — les données réelles et leurs rapports restent hors Git.</text>
  </g>
</svg>
