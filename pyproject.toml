[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gnu-astrophotography-recycle"
version = "0.2.0a1"
description = "Local read-only FITS archive inventory"
requires-python = ">=3.11"
dependencies = ["astropy>=7.2,<8", "numpy>=2.4.1,<2.5"]
license = "GPL-3.0-or-later"
license-files = ["COPYING"]
readme = "README.md"

[project.optional-dependencies]
test = ["pytest>=7.4,<9"]

[project.scripts]
gar = "gar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
